name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'pytest node id(s) to run instead of the full suite'
        required: false
        default: ''

env:
  PIP_INDEX_URL: https://:2023-04-16T23:56:46.279633Z@time-machines-pypi.sealsecurity.io/

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: 3.9.13
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.11'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.3'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.11'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}
      PYTEST_ADDOPTS: -rs ${{ inputs.test-filter }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      run: |
        python -m tox -x "testenv.commands=pytest"

  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: 3.9
    - name: Package
      run: |
        pip install --upgrade build hatchling==1.14.0
        python -m build -s -w --no-isolation
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
